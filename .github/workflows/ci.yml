name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 文档链接
        run: pnpm check:docs
      - name: 格式
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: 类型检查
        run: pnpm typecheck
      - name: 单元、性质与 golden 测试（核心覆盖率不低于 95%）
        run: pnpm test:coverage
      - name: 集成测试
        run: pnpm test:integration
      - name: 端到端测试
        run: pnpm test:e2e
      - name: 构建
        run: pnpm build
