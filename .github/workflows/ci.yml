name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 文档链接
        run: pnpm check:docs
      - name: 格式
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: 类型检查
        run: pnpm typecheck
      - name: 核心纯度类型检查（不含 Node 类型）
        run: pnpm typecheck:core
      - name: 依赖审计
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org/
      - name: 单元、性质与 golden 测试（核心覆盖率不低于 95%）
        run: pnpm test:coverage
      - name: 运行层覆盖率门禁（证据链模块）
        run: pnpm test:coverage:runner
      - name: 集成测试
        run: pnpm test:integration
      - name: 端到端测试
        run: pnpm test:e2e
      - name: 构建
        run: pnpm build
