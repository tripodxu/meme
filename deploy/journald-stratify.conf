# P5-06 journald 大小与保留（docs/09 §6「journald 配置大小/保留」）。
#
# 安装：cp deploy/journald-stratify.conf /etc/systemd/journald.conf.d/stratify.conf
# 并 `systemctl restart systemd-journald`。数值是保守缺省；阈值冻结（告警级）
# 经基线压测后按 docs/09 §9 调整，本文件只管日志占盘上限。
#
# Runner 日志纪律（docs/09 §7）：记录 runId/cell/seed/tick、调用/token、回退、
# 延迟、上传确认与 checkpoint hash；不得把完整 state/raw body 写进 journal。
[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
MaxRetentionSec=14day
MaxFileSec=1day
